name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      # Forzar variables de BD específicas para los tests (evita que DB_USER/DB_* del runner interfieran)
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_DATABASE: eva7
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eva7
        options: >-
          --health-cmd="pg_isready -U postgres -d eva7"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: ./eva7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./eva7/package-lock.json
      - run: npm ci
      - name: Wait for Postgres
        run: |
          # Esperar hasta 30s a que Postgres acepte conexiones en el puerto 5432
          for i in {1..30}; do
            nc -z 127.0.0.1 5432 && echo "Postgres up" && break
            echo "Waiting for Postgres..." && sleep 1
          done
      - run: npm test -- --runInBand
        env:
          NODE_ENV: test
          # Standard PostgreSQL env vars (used by node-postgres)
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: eva7
          # Custom DB_* vars (used by app config)
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: eva7
          # Connection string (some libs prefer this)
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/eva7

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./eva7front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./eva7front/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
