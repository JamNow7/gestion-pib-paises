<mat-card class="crear-pais-card">
  <mat-card-header>
    <mat-card-title>Crear Nuevo País</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="crear-pais-form">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" placeholder="Ej: Argentina" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Continente</mat-label>
        <input matInput formControlName="continente" placeholder="Ej: América" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Población</mat-label>
        <input matInput type="number" formControlName="poblacion" placeholder="Ej: 45000000" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>PIB 2019</mat-label>
        <input matInput type="number" formControlName="pib_2019" placeholder="Ej: 9050" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>PIB 2020</mat-label>
        <input matInput type="number" formControlName="pib_2020" placeholder="Ej: 9730" />
      </mat-form-field>

      <div *ngIf="errorCrearBackend" class="error-container">
        <mat-icon class="error-icon">error</mat-icon>
        <span class="error-message">{{ errorCrearBackend }}</span>
      </div>

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
          <mat-icon>add</mat-icon>
          Guardar
        </button>
        <button mat-stroked-button type="button" (click)="form.reset()">
          <mat-icon>clear</mat-icon>
          Limpiar
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
